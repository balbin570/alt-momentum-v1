name: C Forward Paper Service Health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check internal paper scanner without starting another scan
        run: |
          curl --fail --show-error --silent \
            --max-time 60 \
            --retry 1 \
            "https://alt-momentum-v1.onrender.com/v90-status" \
            | python -c 'import json,sys; s=json.load(sys.stdin); assert s["orders"] is False and s["trading"] is False and s["auto_running"] and s["active_models"] == ["C"], "Paper scanner health check failed"; print("C paper scanner running; real orders disabled")'
