name: Temporary Shadow Test Diagnostics
on:
  pull_request:
jobs:
  diagnose:
    if: github.head_ref == 'codex/c-shadow-mom1-forward-20261111'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run tests and comment concise failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/test-output.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            { echo 'Temporary diagnostic: unit-test failure'; echo ''; echo '~~~text'; tail -n 140 /tmp/test-output.log; echo '~~~'; } > /tmp/comment.txt
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.txt
          fi
          exit "$result"
